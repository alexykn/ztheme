name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Zsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic
      - run: cargo package --locked
      - name: Check every Zsh script
        run: |
          for script in shell/*.zsh shell/segments/*.zsh tools/*.zsh; do
            zsh -n "$script" || exit
          done

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Install Zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: cargo test --all-targets --all-features

  # Dependabot's Cargo pull requests merge themselves once every check above
  # passes. Both the author and the latest pusher must be Dependabot, so a
  # person pushing to its branch disables the merge. Action updates change
  # the workflows themselves and wait for a review.
  merge-dependabot:
    name: Merge Dependabot update
    needs: [quality, test]
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
      && startsWith(github.head_ref, 'dependabot/cargo/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --delete-branch "$PR_URL"
