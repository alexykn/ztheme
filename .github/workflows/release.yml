name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # The patch-release workflow calls this after pushing a tag: a tag pushed
  # with the workflow token does not start other workflows by itself.
  workflow_call:
    inputs:
      tag:
        description: Release tag to verify, build and publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Set for tag pushes and workflow calls; empty for a manual rehearsal.
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Zsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic
      - run: cargo test --all-targets --all-features
      - run: cargo package --locked
      - run: zsh -n shell/ztheme.zsh shell/defaults.zsh
      - name: Verify tag version
        if: env.RELEASE_TAG != ''
        run: |
          tag_version="${RELEASE_TAG#v}"
          package_version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          test "$tag_version" = "$package_version"

  build:
    name: Build (${{ matrix.asset }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: ztheme-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: ztheme-aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: ztheme-x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
            asset: ztheme-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package archive
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/ztheme" dist/ztheme
          cp LICENSE README.md dist/
          tar -C dist -czf "${{ matrix.asset }}.tar.gz" ztheme LICENSE README.md
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  rehearse-release-assets:
    name: Rehearse release assets
    if: inputs.tag == '' && github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Verify release assets
        run: |
          test "$(find release -maxdepth 1 -name 'ztheme-*.tar.gz' -type f | wc -l | tr -d ' ')" = 4
          sha256sum release/*.tar.gz > release/SHA256SUMS
          test -s release/SHA256SUMS

  publish:
    name: Publish release
    if: inputs.tag != '' || github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes release/*
