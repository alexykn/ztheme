name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: ztheme-x86_64-unknown-linux-gnu
          - os: macos-13
            asset: ztheme-x86_64-apple-darwin
          - os: macos-14
            asset: ztheme-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo build --release --locked
      - name: Package archive
        run: |
          mkdir dist
          cp target/release/ztheme "dist/${{ matrix.asset }}"
          tar -C dist -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          test "$tag_version" = "$package_version"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes release/*
